server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
        # /api/check resets + re-runs 19 checks against the real dataset --
        # optimized to need far fewer resets than that number, but it's
        # still real work against ~100k rows, not instant. Default nginx
        # timeouts (60s) are tuned for normal API calls, not this.
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    location /sql/ {
        alias /usr/share/nginx/sql-src/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
